<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">CampusTrade hybrid database entity relationship diagram</title>
  <desc id="desc">PostgreSQL users, items, orders, order items and payment logs, with MongoDB listings and reviews linked by stable PostgreSQL IDs.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#202b24} .box{fill:#fffefa;stroke:#315c43;stroke-width:2} .mongo{fill:#f1eee3;stroke:#8b6f3d;stroke-width:2} .head{fill:#315c43} .mhead{fill:#8b6f3d} .headtext{fill:#fff;font-weight:bold} .field{font-size:13px}</style>
  <text x="45" y="35" font-size="24" font-weight="bold">CampusTrade database foundations</text>
  <text x="45" y="60" font-size="13">PostgreSQL is authoritative; MongoDB stores flexible listing metadata and reviews. Checkout uses a completion trigger and reporting views.</text>
  <g transform="translate(45 100)"><rect class="box" width="220" height="150" rx="6"/><rect class="head" width="220" height="32" rx="6"/><text class="headtext" x="12" y="22">USERS</text><text class="field" x="12" y="56">PK id BIGINT</text><text class="field" x="12" y="80">full_name VARCHAR</text><text class="field" x="12" y="104">email UNIQUE</text><text class="field" x="12" y="128">role CHECK</text></g>
  <g transform="translate(340 100)"><rect class="box" width="240" height="170" rx="6"/><rect class="head" width="240" height="32" rx="6"/><text class="headtext" x="12" y="22">ITEMS</text><text class="field" x="12" y="56">PK id BIGINT</text><text class="field" x="12" y="80">FK seller_id</text><text class="field" x="12" y="104">price NUMERIC(12,2)</text><text class="field" x="12" y="128">status CHECK</text><text class="field" x="12" y="152">category VARCHAR</text></g>
  <g transform="translate(680 100)"><rect class="box" width="230" height="150" rx="6"/><rect class="head" width="230" height="32" rx="6"/><text class="headtext" x="12" y="22">ORDERS</text><text class="field" x="12" y="56">PK id BIGINT</text><text class="field" x="12" y="80">FK buyer_id</text><text class="field" x="12" y="104">status CHECK</text><text class="field" x="12" y="128">total_amount NUMERIC</text></g>
  <g transform="translate(390 390)"><rect class="box" width="240" height="150" rx="6"/><rect class="head" width="240" height="32" rx="6"/><text class="headtext" x="12" y="22">ORDER_ITEMS</text><text class="field" x="12" y="56">PK id BIGINT</text><text class="field" x="12" y="80">FK order_id</text><text class="field" x="12" y="104">FK item_id UNIQUE</text><text class="field" x="12" y="128">unit_price NUMERIC</text></g>
  <g transform="translate(730 390)"><rect class="box" width="240" height="150" rx="6"/><rect class="head" width="240" height="32" rx="6"/><text class="headtext" x="12" y="22">PAYMENT_LOGS</text><text class="field" x="12" y="56">PK id BIGINT</text><text class="field" x="12" y="80">FK order_id</text><text class="field" x="12" y="104">provider, status</text><text class="field" x="12" y="128">amount NUMERIC</text></g>
  <g transform="translate(45 390)"><rect class="mongo" width="250" height="150" rx="6"/><rect class="mhead" width="250" height="32" rx="6"/><text class="headtext" x="12" y="22">MONGO listings</text><text class="field" x="12" y="56">UK postgresItemId</text><text class="field" x="12" y="80">title, description</text><text class="field" x="12" y="104">attributes object</text><text class="field" x="12" y="128">status, imageMetadata</text></g>
  <g transform="translate(1010 390)"><rect class="mongo" width="150" height="150" rx="6"/><rect class="mhead" width="150" height="32" rx="6"/><text class="headtext" x="12" y="22">MONGO reviews</text><text class="field" x="12" y="56">postgresItemId</text><text class="field" x="12" y="80">reviewerId</text><text class="field" x="12" y="104">rating 1..5</text><text class="field" x="12" y="128">reviewText</text></g>
  <path class="line" d="M265 170 H340 M580 180 H680 M460 270 V390 M795 250 V390 M580 475 H730 M580 455 H1010 M265 205 C320 300 360 350 390 430 M265 220 C650 330 850 350 1010 430"/>
</svg>